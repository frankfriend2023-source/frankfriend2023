<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自媒体内容体检台</title>
<style>
  /* ── Reset & Base ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream:       #f7f4ef;
    --cream-deep:  #ede9e1;
    --cream-card:  #faf8f4;
    --green:       #2d5a47;
    --green-light: #3d7a62;
    --green-pale:  #e8f0ec;
    --green-muted: #b8cfc5;
    --ink:         #1e2d27;
    --ink-mid:     #4a6258;
    --ink-soft:    #7a9488;
    --ink-ghost:   #b0c4bc;
    --warm-line:   #ddd5c8;
    --font-sans:   'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
    --font-serif:  'STSong', 'SimSun', Georgia, serif;
    --r-sm: 8px;
    --r-md: 14px;
    --r-lg: 20px;
    --shadow-sm: 0 1px 4px rgba(45,90,71,.06);
    --shadow-md: 0 4px 20px rgba(45,90,71,.10);
    --shadow-lg: 0 12px 40px rgba(45,90,71,.14);
    --transition: .2s cubic-bezier(.4,0,.2,1);
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--cream);
    color: var(--ink);
    font-family: var(--font-sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── Decorative background texture ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(45,90,71,.04) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(45,90,71,.04) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── Layout ── */
  .page {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 680px;
    padding: 0 20px 80px;
  }

  /* ── Header ── */
  .header {
    padding: 56px 0 44px;
    text-align: center;
  }
  .header-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 18px;
  }
  .header-eyebrow::before,
  .header-eyebrow::after {
    content: '';
    display: block;
    width: 24px;
    height: 1px;
    background: var(--green-muted);
  }
  .header h1 {
    font-family: var(--font-serif);
    font-size: clamp(26px, 6vw, 38px);
    font-weight: 400;
    color: var(--green);
    letter-spacing: .5px;
    line-height: 1.35;
    margin-bottom: 12px;
  }
  .header h1 em {
    font-style: normal;
    display: inline-block;
    border-bottom: 2px solid var(--green-muted);
    padding-bottom: 2px;
  }
  .header-desc {
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.8;
    max-width: 380px;
    margin: 0 auto;
  }

  /* ── Card ── */
  .card {
    background: var(--cream-card);
    border: 1px solid var(--warm-line);
    border-radius: var(--r-lg);
    padding: 28px 28px;
    box-shadow: var(--shadow-sm);
    margin-bottom: 16px;
    transition: box-shadow var(--transition);
  }
  .card:focus-within {
    box-shadow: var(--shadow-md);
  }

  /* ── Field label ── */
  .field { margin-bottom: 0; }
  .field + .field { margin-top: 24px; }

  .field-label {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 10px;
  }
  .field-label-text {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-mid);
    letter-spacing: .3px;
  }
  .field-label-hint {
    font-size: 12px;
    color: var(--ink-ghost);
  }
  .field-required {
    width: 5px; height: 5px;
    background: var(--green);
    border-radius: 50%;
    flex-shrink: 0;
    margin-bottom: 1px;
  }

  /* ── Textarea ── */
  .textarea-wrap { position: relative; }
  textarea {
    width: 100%;
    background: var(--cream);
    border: 1.5px solid var(--warm-line);
    border-radius: var(--r-md);
    padding: 14px 16px 36px;
    font-family: var(--font-sans);
    font-size: 15px;
    color: var(--ink);
    line-height: 1.75;
    resize: none;
    outline: none;
    transition: border-color var(--transition), box-shadow var(--transition);
    min-height: 110px;
  }
  textarea::placeholder { color: var(--ink-ghost); }
  textarea:focus {
    border-color: var(--green-muted);
    box-shadow: 0 0 0 3px rgba(45,90,71,.07);
  }
  .textarea-counter {
    position: absolute;
    bottom: 12px;
    right: 14px;
    font-size: 11px;
    color: var(--ink-ghost);
    pointer-events: none;
    transition: color var(--transition);
  }
  .textarea-counter.near { color: var(--ink-soft); }
  .textarea-counter.full { color: #c0714a; }

  /* ── Platform multi-select chips ── */
  .platform-chips {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  @media (max-width: 440px) {
    .platform-chips { grid-template-columns: repeat(2, 1fr); }
  }

  .platform-chip {
    position: relative;
    cursor: pointer;
  }
  .platform-chip input[type="checkbox"] {
    position: absolute;
    opacity: 0;
    width: 0; height: 0;
  }
  .platform-chip-label {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 14px 8px 12px;
    background: var(--cream);
    border: 1.5px solid var(--warm-line);
    border-radius: var(--r-md);
    cursor: pointer;
    transition: all var(--transition);
    user-select: none;
  }
  .platform-chip-label:hover {
    border-color: var(--green-muted);
    background: var(--green-pale);
  }
  .platform-chip input:checked + .platform-chip-label {
    background: var(--green-pale);
    border-color: var(--green);
    box-shadow: inset 0 0 0 1px var(--green);
  }
  .platform-chip-icon {
    font-size: 22px;
    line-height: 1;
  }
  .platform-chip-name {
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-mid);
    letter-spacing: .3px;
  }
  .platform-chip input:checked + .platform-chip-label .platform-chip-name {
    color: var(--green);
  }
  .platform-check {
    position: absolute;
    top: 7px; right: 8px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--green);
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transform: scale(.5);
    transition: all var(--transition);
  }
  .platform-check svg { width: 9px; height: 9px; stroke: #fff; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .platform-chip input:checked ~ .platform-check {
    opacity: 1;
    transform: scale(1);
  }

  /* ── Style single-select ── */
  .style-options {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  @media (max-width: 440px) {
    .style-options { grid-template-columns: repeat(2, 1fr); }
  }

  .style-option {
    position: relative;
    cursor: pointer;
  }
  .style-option input[type="radio"] {
    position: absolute;
    opacity: 0;
    width: 0; height: 0;
  }
  .style-option-label {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    padding: 14px 8px 12px;
    background: var(--cream);
    border: 1.5px solid var(--warm-line);
    border-radius: var(--r-md);
    cursor: pointer;
    transition: all var(--transition);
    user-select: none;
  }
  .style-option-label:hover {
    border-color: var(--green-muted);
    background: var(--green-pale);
  }
  .style-option input:checked + .style-option-label {
    background: var(--green);
    border-color: var(--green);
  }
  .style-option-emoji {
    font-size: 20px;
    line-height: 1;
  }
  .style-option-name {
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-mid);
  }
  .style-option input:checked + .style-option-label .style-option-name {
    color: #fff;
  }
  .style-option-desc {
    font-size: 10.5px;
    color: var(--ink-ghost);
    text-align: center;
    line-height: 1.4;
  }
  .style-option input:checked + .style-option-label .style-option-desc {
    color: rgba(255,255,255,.75);
  }

  /* ── Divider ── */
  .divider {
    height: 1px;
    background: linear-gradient(to right, transparent, var(--warm-line) 20%, var(--warm-line) 80%, transparent);
    margin: 8px 0;
  }

  /* ── Generate Button ── */
  .btn-wrap { margin-top: 8px; }
  .btn-generate {
    width: 100%;
    padding: 17px 24px;
    background: #2d5a47;
    color: #fff;
    border: none;
    border-radius: var(--r-md);
    font-family: var(--font-sans);
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
    box-shadow: 0 2px 12px rgba(45,90,71,.25), 0 1px 3px rgba(45,90,71,.15);
    position: relative;
    overflow: hidden;
  }
  .btn-generate::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,.08) 0%, transparent 60%);
    pointer-events: none;
  }
  .btn-generate:hover:not(:disabled) {
    background: var(--green-light);
    box-shadow: 0 4px 20px rgba(45,90,71,.32), 0 1px 4px rgba(45,90,71,.2);
    transform: translateY(-1px);
  }
  .btn-generate:active:not(:disabled) {
    transform: translateY(0);
    box-shadow: 0 2px 8px rgba(45,90,71,.2);
  }
  .btn-generate:disabled {
    opacity: .55;
    cursor: not-allowed;
  }
  .btn-icon {
    width: 18px; height: 18px;
    transition: transform var(--transition);
  }
  .btn-generate:hover .btn-icon { transform: translateX(2px); }

  /* ── Validation hint ── */
  .validation-hint {
    font-size: 12px;
    color: #c0714a;
    margin-top: 10px;
    text-align: center;
    min-height: 18px;
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity var(--transition), transform var(--transition);
  }
  .validation-hint.show {
    opacity: 1;
    transform: translateY(0);
  }

  /* ── Output placeholder (for future use) ── */
  .output-placeholder {
    border: 1.5px dashed var(--warm-line);
    border-radius: var(--r-lg);
    padding: 40px 24px;
    text-align: center;
    color: var(--ink-ghost);
    font-size: 13px;
    line-height: 2;
    display: none;
  }
  .output-placeholder.visible { display: block; }
  .output-placeholder-icon {
    font-size: 32px;
    margin-bottom: 8px;
    opacity: .5;
  }

  /* ── Footer ── */
  footer {
    width: 100%;
    text-align: center;
    padding: 28px 0 20px;
    font-size: 12px;
    color: var(--ink-ghost);
    letter-spacing: .5px;
    position: relative;
    z-index: 1;
  }
  footer::before {
    content: '';
    display: block;
    width: 40px;
    height: 1px;
    background: var(--warm-line);
    margin: 0 auto 14px;
  }
</style>
</head>
<body>

<div class="page">

  <!-- Header -->
  <header class="header">
    <div class="header-eyebrow">Content Studio</div>
    <h1>自媒体<em>内容体检台</em></h1>
    <p class="header-desc">输入你的选题，选择平台与风格<br>生成标题、脚本、文案与专业体检报告</p>
  </header>

  <!-- Form Card -->
  <div class="card">

    <!-- 选题输入 -->
    <div class="field">
      <p style="font-size:15px;color:var(--ink-mid);line-height:1.7;margin-bottom:14px;font-weight:500;">把你的选题，变成读者愿意停下来看的内容</p>
      <div class="field-label">
        <span class="field-required"></span>
        <span class="field-label-text">选题 / 文案内容</span>
        <span class="field-label-hint">请描述你想创作的主题或已有文案</span>
      </div>
      <div class="textarea-wrap">
        <textarea
          id="topicInput"
          placeholder="例如：月薪 5000 在上海如何存下第一个 10 万，不靠省吃俭用…"
          maxlength="500"
          rows="4"
          oninput="onTopicInput(this)"
        ></textarea>
        <span class="textarea-counter" id="topicCounter">0 / 500</span>
      </div>
    </div>

    <div class="divider" style="margin: 22px 0;"></div>

    <!-- 平台多选 -->
    <div class="field">
      <div class="field-label">
        <span class="field-required"></span>
        <span class="field-label-text">发布平台</span>
        <span class="field-label-hint">可多选</span>
      </div>
      <div class="platform-chips">

        <label class="platform-chip">
          <input type="checkbox" name="platform" value="小红书" checked>
          <div class="platform-chip-label">
            <span class="platform-chip-icon">🌸</span>
            <span class="platform-chip-name">小红书</span>
          </div>
          <div class="platform-check">
            <svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg>
          </div>
        </label>

        <label class="platform-chip">
          <input type="checkbox" name="platform" value="抖音">
          <div class="platform-chip-label">
            <span class="platform-chip-icon">🎵</span>
            <span class="platform-chip-name">抖音</span>
          </div>
          <div class="platform-check">
            <svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg>
          </div>
        </label>

        <label class="platform-chip">
          <input type="checkbox" name="platform" value="视频号">
          <div class="platform-chip-label">
            <span class="platform-chip-icon">📺</span>
            <span class="platform-chip-name">视频号</span>
          </div>
          <div class="platform-check">
            <svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg>
          </div>
        </label>

        <label class="platform-chip">
          <input type="checkbox" name="platform" value="公众号">
          <div class="platform-chip-label">
            <span class="platform-chip-icon">✉️</span>
            <span class="platform-chip-name">公众号</span>
          </div>
          <div class="platform-check">
            <svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg>
          </div>
        </label>

      </div>
    </div>

    <div class="divider" style="margin: 22px 0;"></div>

    <!-- 风格单选 -->
    <div class="field">
      <div class="field-label">
        <span class="field-required"></span>
        <span class="field-label-text">内容风格</span>
      </div>
      <div class="style-options">

        <label class="style-option">
          <input type="radio" name="style" value="温暖" checked>
          <div class="style-option-label">
            <span class="style-option-emoji">🌿</span>
            <span class="style-option-name">温暖</span>
            <span class="style-option-desc">亲切陪伴<br>情感共鸣</span>
          </div>
        </label>

        <label class="style-option">
          <input type="radio" name="style" value="犀利">
          <div class="style-option-label">
            <span class="style-option-emoji">⚡</span>
            <span class="style-option-name">犀利</span>
            <span class="style-option-desc">直击痛点<br>观点鲜明</span>
          </div>
        </label>

        <label class="style-option">
          <input type="radio" name="style" value="专业">
          <div class="style-option-label">
            <span class="style-option-emoji">📐</span>
            <span class="style-option-name">专业</span>
            <span class="style-option-desc">数据支撑<br>权威可信</span>
          </div>
        </label>

        <label class="style-option">
          <input type="radio" name="style" value="口语化">
          <div class="style-option-label">
            <span class="style-option-emoji">💬</span>
            <span class="style-option-name">口语化</span>
            <span class="style-option-desc">随性自然<br>像在聊天</span>
          </div>
        </label>

      </div>
    </div>

  </div><!-- /card -->

  <!-- Generate Button -->
  <div class="btn-wrap">
    <button class="btn-generate" id="generateBtn" onclick="handleGenerate()">
      <svg class="btn-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 2l1.8 5.4H16l-4.5 3.3 1.7 5.3L9 13l-4.2 3 1.7-5.3L2 7.4h5.2z"/>
      </svg>
      开始生成
      <svg class="btn-icon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9h12M10 4l5 5-5 5"/>
      </svg>
    </button>
    <div class="validation-hint" id="validationHint"></div>
  </div>

  <!-- Output placeholder -->
  <div class="output-placeholder" id="outputPlaceholder">
    <div class="output-placeholder-icon">✦</div>
    填写选题并点击「开始生成」<br>内容将在这里呈现
  </div>

</div><!-- /page -->

<footer>自媒体内容体检台 · 内容数据仅在本地处理</footer>

<script>
// ── Textarea counter ───────────────────────────────────
function onTopicInput(el) {
  const len = el.value.length;
  const counter = document.getElementById('topicCounter');
  counter.textContent = len + ' / 500';
  counter.className = 'textarea-counter' + (len > 450 ? ' full' : len > 350 ? ' near' : '');

  // Clear validation hint on typing
  hideHint();
}

// ── Validation ─────────────────────────────────────────
function showHint(msg) {
  const el = document.getElementById('validationHint');
  el.textContent = msg;
  el.classList.add('show');
}
function hideHint() {
  document.getElementById('validationHint').classList.remove('show');
}

// ── Collect form values ────────────────────────────────
function getFormValues() {
  const topic = document.getElementById('topicInput').value.trim();
  const platforms = [...document.querySelectorAll('input[name="platform"]:checked')].map(i => i.value);
  const style = document.querySelector('input[name="style"]:checked')?.value || '温暖';
  return { topic, platforms, style };
}

// ── Handle generate ────────────────────────────────────
function handleGenerate() {
  const { topic, platforms, style } = getFormValues();

  if (!topic) {
    showHint('请先填写选题或文案内容');
    document.getElementById('topicInput').focus();
    return;
  }
  if (platforms.length === 0) {
    showHint('请至少选择一个发布平台');
    return;
  }

  hideHint();

  // Placeholder: show output area (real generation wired up separately)
  const placeholder = document.getElementById('outputPlaceholder');
  placeholder.classList.add('visible');

  // Dispatch a custom event so external scripts (e.g. content-checkup.js) can listen
  document.dispatchEvent(new CustomEvent('contentGenerate', {
    detail: { topic, platforms, style }
  }));
}

// ── Keyboard shortcut: Cmd/Ctrl + Enter ───────────────
document.getElementById('topicInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) handleGenerate();
});

// ── Ensure at least one platform stays checked ─────────
document.querySelectorAll('input[name="platform"]').forEach(cb => {
  cb.addEventListener('change', () => {
    const checked = document.querySelectorAll('input[name="platform"]:checked');
    if (checked.length === 0) {
      cb.checked = true; // revert
    }
    hideHint();
  });
});
</script>
</body>
</html>
