<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自媒体内容体检台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f13;
    --surface: #1a1a24;
    --surface2: #22222f;
    --border: #2e2e40;
    --accent: #7c6af7;
    --accent2: #f7706a;
    --accent3: #4fd1a5;
    --text: #e8e8f0;
    --text2: #9090a8;
    --text3: #5a5a70;
    --radius: 12px;
    --font: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    padding: 24px 16px 60px;
  }

  /* ── Header ── */
  header {
    text-align: center;
    padding: 32px 0 40px;
  }
  header .badge {
    display: inline-block;
    background: linear-gradient(135deg, #7c6af720, #f7706a20);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 16px;
    font-size: 12px;
    color: var(--text2);
    margin-bottom: 16px;
    letter-spacing: 1px;
  }
  header h1 {
    font-size: clamp(24px, 5vw, 36px);
    font-weight: 700;
    background: linear-gradient(135deg, #fff 30%, #a09af7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.3;
  }
  header p {
    margin-top: 10px;
    color: var(--text2);
    font-size: 14px;
  }

  /* ── Layout ── */
  .main {
    max-width: 900px;
    margin: 0 auto;
    display: grid;
    gap: 20px;
  }

  /* ── Card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
  }
  .card-title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    color: var(--text2);
    text-transform: uppercase;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
  }

  /* ── API Key Row ── */
  .apikey-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .apikey-row input {
    flex: 1;
  }
  .apikey-note {
    font-size: 12px;
    color: var(--text3);
    margin-top: 8px;
  }
  .apikey-note a {
    color: var(--accent);
    text-decoration: none;
  }

  /* ── Form Grid ── */
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 600px) {
    .form-grid { grid-template-columns: 1fr; }
  }
  .form-group { display: flex; flex-direction: column; gap: 8px; }
  .form-group.full { grid-column: 1 / -1; }
  label {
    font-size: 13px;
    color: var(--text2);
    font-weight: 500;
  }
  input, select, textarea {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
    width: 100%;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
  }
  select option { background: var(--surface2); }
  textarea { resize: vertical; min-height: 80px; }

  /* ── Chip toggles ── */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text2);
    font-size: 13px;
    cursor: pointer;
    transition: all .15s;
    user-select: none;
  }
  .chip:hover { border-color: var(--accent); color: var(--text); }
  .chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }

  /* ── Outputs toggle ── */
  .outputs-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .output-chip {
    padding: 7px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text2);
    font-size: 13px;
    cursor: pointer;
    transition: all .15s;
    user-select: none;
    display: flex; align-items: center; gap: 6px;
  }
  .output-chip .icon { font-size: 15px; }
  .output-chip.active {
    border-color: var(--accent3);
    color: var(--accent3);
    background: #4fd1a510;
  }

  /* ── Generate Button ── */
  .btn-generate {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, var(--accent), #a09af7);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: opacity .2s, transform .1s;
    font-family: var(--font);
  }
  .btn-generate:hover:not(:disabled) { opacity: .88; }
  .btn-generate:active:not(:disabled) { transform: scale(.98); }
  .btn-generate:disabled { opacity: .4; cursor: not-allowed; }

  /* ── Progress ── */
  .progress-bar {
    height: 3px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
    display: none;
  }
  .progress-bar.visible { display: block; }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent3));
    border-radius: 999px;
    animation: progress 2s ease-in-out infinite;
    width: 60%;
  }
  @keyframes progress {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(250%); }
  }

  /* ── Output Sections ── */
  .output-section { display: none; }
  .output-section.visible { display: block; }

  .result-tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
    overflow-x: auto;
  }
  .tab-btn {
    padding: 10px 18px;
    background: none;
    border: none;
    color: var(--text2);
    font-size: 13px;
    font-family: var(--font);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    white-space: nowrap;
    transition: color .15s, border-color .15s;
    display: flex; align-items: center; gap: 6px;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-btn:hover:not(.active) { color: var(--text); }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ── Result content ── */
  .result-block {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    position: relative;
  }
  .result-block .copy-btn {
    position: absolute;
    top: 12px; right: 12px;
    background: var(--border);
    border: none;
    border-radius: 6px;
    color: var(--text2);
    font-size: 12px;
    padding: 4px 10px;
    cursor: pointer;
    font-family: var(--font);
    transition: background .15s;
  }
  .result-block .copy-btn:hover { background: var(--accent); color: #fff; }
  .result-block .copy-btn.copied { background: var(--accent3); color: #fff; }

  .result-text {
    white-space: pre-wrap;
    font-size: 14px;
    line-height: 1.8;
    color: var(--text);
    padding-right: 60px;
  }

  /* Title variants */
  .title-list { display: flex; flex-direction: column; gap: 10px; }
  .title-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    transition: border-color .2s;
  }
  .title-item:hover { border-color: var(--accent); }
  .title-item .num {
    font-size: 11px;
    color: var(--accent);
    font-weight: 700;
    min-width: 20px;
    padding-top: 2px;
  }
  .title-item .text { flex: 1; font-size: 14px; line-height: 1.6; }
  .title-item .copy-btn {
    background: var(--border);
    border: none;
    border-radius: 6px;
    color: var(--text2);
    font-size: 12px;
    padding: 4px 10px;
    cursor: pointer;
    font-family: var(--font);
    white-space: nowrap;
    transition: background .15s;
    flex-shrink: 0;
  }
  .title-item .copy-btn:hover { background: var(--accent); color: #fff; }

  /* Health Report */
  .health-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
    margin-bottom: 20px;
  }
  .health-metric {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    text-align: center;
  }
  .health-metric .score {
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 4px;
  }
  .health-metric .score.high { color: var(--accent3); }
  .health-metric .score.mid { color: #f7c96a; }
  .health-metric .score.low { color: var(--accent2); }
  .health-metric .label { font-size: 12px; color: var(--text2); }

  .advice-list { display: flex; flex-direction: column; gap: 10px; }
  .advice-item {
    display: flex;
    gap: 12px;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.6;
  }
  .advice-item.good { background: #4fd1a510; border: 1px solid #4fd1a530; }
  .advice-item.warn { background: #f7c96a10; border: 1px solid #f7c96a30; }
  .advice-item.bad  { background: #f7706a10; border: 1px solid #f7706a30; }
  .advice-item .icon { font-size: 16px; flex-shrink: 0; }

  /* Streaming cursor */
  .streaming::after {
    content: '▋';
    animation: blink .7s step-end infinite;
    color: var(--accent);
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* Error */
  .error-box {
    background: #f7706a12;
    border: 1px solid #f7706a40;
    border-radius: 8px;
    padding: 14px 16px;
    color: #f7706a;
    font-size: 13px;
    display: none;
  }
  .error-box.visible { display: block; }

  /* Footer */
  footer {
    text-align: center;
    margin-top: 48px;
    color: var(--text3);
    font-size: 12px;
  }
</style>
</head>
<body>

<header>
  <div class="badge">AI CONTENT STUDIO</div>
  <h1>自媒体内容体检台</h1>
  <p>输入你的选题信息，一键生成标题、脚本、文案，并获取专业体检报告</p>
</header>

<div class="main">

  <!-- API Key -->
  <div class="card">
    <div class="card-title"><span class="dot"></span>API 配置</div>
    <div class="apikey-row">
      <input type="password" id="apiKey" placeholder="输入你的 Anthropic API Key (sk-ant-...)" autocomplete="off">
      <button class="chip" onclick="toggleKeyVisibility()" id="toggleKeyBtn">显示</button>
    </div>
    <div class="apikey-note">
      API Key 仅在本地浏览器使用，不会上传任何服务器。
      获取 Key：<a href="https://console.anthropic.com/" target="_blank">console.anthropic.com</a>
    </div>
  </div>

  <!-- Input Form -->
  <div class="card">
    <div class="card-title"><span class="dot" style="background:var(--accent2)"></span>内容信息</div>
    <div class="form-grid">

      <div class="form-group full">
        <label>选题 / 内容主题 *</label>
        <textarea id="topic" placeholder="例如：月薪 5000 如何在上海存到第一个 10 万" rows="2"></textarea>
      </div>

      <div class="form-group">
        <label>发布平台</label>
        <div class="chips" id="platformChips">
          <span class="chip active" data-val="小红书">小红书</span>
          <span class="chip" data-val="抖音">抖音</span>
          <span class="chip" data-val="微信公众号">公众号</span>
          <span class="chip" data-val="B站">B站</span>
          <span class="chip" data-val="视频号">视频号</span>
          <span class="chip" data-val="知乎">知乎</span>
        </div>
      </div>

      <div class="form-group">
        <label>目标用户</label>
        <input type="text" id="audience" placeholder="例如：25-35岁职场女性，想理财但不懂投资">
      </div>

      <div class="form-group">
        <label>内容风格</label>
        <div class="chips" id="styleChips">
          <span class="chip active" data-val="真实接地气">接地气</span>
          <span class="chip" data-val="干货实用">干货</span>
          <span class="chip" data-val="幽默搞笑">幽默</span>
          <span class="chip" data-val="情感共鸣">情感</span>
          <span class="chip" data-val="专业权威">权威</span>
          <span class="chip" data-val="励志正能量">励志</span>
        </div>
      </div>

      <div class="form-group">
        <label>内容时长 / 字数</label>
        <select id="length">
          <option value="短（30秒视频 / 200字图文）">短内容（30s/200字）</option>
          <option value="中（1-3分钟视频 / 800字图文）" selected>中内容（1-3min/800字）</option>
          <option value="长（5-10分钟视频 / 2000字图文）">长内容（5-10min/2000字）</option>
        </select>
      </div>

      <div class="form-group full">
        <label>补充说明（可选）</label>
        <input type="text" id="extra" placeholder="例如：不要太说教，加入个人故事，结尾要有行动号召">
      </div>

    </div>
  </div>

  <!-- Output Selection -->
  <div class="card">
    <div class="card-title"><span class="dot" style="background:var(--accent3)"></span>选择输出内容</div>
    <div class="outputs-row">
      <div class="output-chip active" data-out="titles" onclick="toggleOutput(this)">
        <span class="icon">✦</span> 爆款标题 x5
      </div>
      <div class="output-chip active" data-out="script" onclick="toggleOutput(this)">
        <span class="icon">🎬</span> 视频脚本
      </div>
      <div class="output-chip active" data-out="copy" onclick="toggleOutput(this)">
        <span class="icon">✍️</span> 图文文案
      </div>
      <div class="output-chip active" data-out="report" onclick="toggleOutput(this)">
        <span class="icon">🩺</span> 体检报告
      </div>
    </div>
  </div>

  <!-- Error -->
  <div class="error-box" id="errorBox"></div>

  <!-- Generate Button -->
  <button class="btn-generate" id="generateBtn" onclick="generate()">
    🚀 开始生成内容
  </button>

  <!-- Progress -->
  <div class="progress-bar" id="progressBar"><div class="progress-fill"></div></div>

  <!-- Output -->
  <div class="card output-section" id="outputSection">
    <div class="result-tabs" id="resultTabs"></div>
    <div id="tabPanels"></div>
  </div>

</div>

<footer>自媒体内容体检台 · 数据仅在本地浏览器处理</footer>

<script>
// ── State ──────────────────────────────────────────────
const state = {
  platform: '小红书',
  style: '真实接地气',
  outputs: new Set(['titles', 'script', 'copy', 'report'])
};

// ── Chip toggles ───────────────────────────────────────
document.querySelectorAll('#platformChips .chip').forEach(c => {
  c.addEventListener('click', () => {
    document.querySelectorAll('#platformChips .chip').forEach(x => x.classList.remove('active'));
    c.classList.add('active');
    state.platform = c.dataset.val;
  });
});
document.querySelectorAll('#styleChips .chip').forEach(c => {
  c.addEventListener('click', () => {
    document.querySelectorAll('#styleChips .chip').forEach(x => x.classList.remove('active'));
    c.classList.add('active');
    state.style = c.dataset.val;
  });
});
function toggleOutput(el) {
  const key = el.dataset.out;
  if (state.outputs.has(key)) {
    if (state.outputs.size === 1) return; // keep at least one
    state.outputs.delete(key);
    el.classList.remove('active');
  } else {
    state.outputs.add(key);
    el.classList.add('active');
  }
}
function toggleKeyVisibility() {
  const inp = document.getElementById('apiKey');
  const btn = document.getElementById('toggleKeyBtn');
  if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '隐藏'; }
  else { inp.type = 'password'; btn.textContent = '显示'; }
}

// ── Build Prompt ───────────────────────────────────────
function buildPrompt() {
  const topic    = document.getElementById('topic').value.trim();
  const audience = document.getElementById('audience').value.trim() || '泛大众';
  const length   = document.getElementById('length').value;
  const extra    = document.getElementById('extra').value.trim();
  const outs     = [...state.outputs];

  const sections = [];

  if (outs.includes('titles')) sections.push(`
## 一、爆款标题（输出5个）
为以下内容生成5个适合${state.platform}平台的爆款标题。
要求：
- 符合${state.platform}平台标题规律
- 有好奇心/痛点/利益点/数字/冲突感
- 风格：${state.style}
- 每行一个标题，前加序号

格式：
1. 标题文字
2. 标题文字
（以此类推）`);

  if (outs.includes('script')) sections.push(`
## 二、视频脚本
为以下内容生成一份完整视频脚本，时长/篇幅：${length}。
要求：
- 开头3秒钩子（强吸引力）
- 清晰结构：开头 → 主体（分2-3段）→ 结尾（行动号召）
- 风格：${state.style}，适合${state.platform}
- 包含镜头/动作/配音提示（用【】标注）

按段落输出。`);

  if (outs.includes('copy')) sections.push(`
## 三、图文文案
生成一篇适合${state.platform}的图文文案，篇幅：${length}。
要求：
- 有引人入胜的开篇
- 正文分段，可用表情符号增加可读性
- 结尾引导互动（点赞/收藏/评论/关注）
- 风格：${state.style}

直接输出完整文案。`);

  if (outs.includes('report')) sections.push(`
## 四、内容体检报告
对以上内容方向进行专业评估，输出结构化报告：

### 评分维度（每项0-100分）
- 选题热度：
- 平台适配度：
- 目标用户匹配：
- 内容差异化：
- 变现潜力：

### 优势分析（2-3条）
### 风险提示（2-3条）
### 优化建议（3-5条可执行建议）
### 综合评分与一句话总结`);

  const prompt = `你是一位专业的${state.platform}内容策划专家，精通爆款内容创作。

# 创作任务信息
- 选题：${topic}
- 平台：${state.platform}
- 目标用户：${audience}
- 内容风格：${state.style}
- 内容时长/篇幅：${length}
${extra ? `- 特殊要求：${extra}` : ''}

请依次完成以下任务，每个部分用 ## 标题隔开：

${sections.join('\n\n')}

---
请用中文输出，内容要具体、可执行、符合当下平台趋势。`;

  return { prompt, topic };
}

// ── Render Tabs ────────────────────────────────────────
const TAB_META = {
  titles: { label: '✦ 爆款标题', icon: '✦' },
  script: { label: '🎬 视频脚本', icon: '🎬' },
  copy:   { label: '✍️ 图文文案',  icon: '✍️' },
  report: { label: '🩺 体检报告', icon: '🩺' }
};

function initOutputUI() {
  const tabs = document.getElementById('resultTabs');
  const panels = document.getElementById('tabPanels');
  tabs.innerHTML = '';
  panels.innerHTML = '';

  const outs = [...state.outputs];
  outs.forEach((key, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
    btn.textContent = TAB_META[key].label;
    btn.dataset.tab = key;
    btn.onclick = () => switchTab(key);
    tabs.appendChild(btn);

    const panel = document.createElement('div');
    panel.className = 'tab-panel' + (i === 0 ? ' active' : '');
    panel.id = 'panel-' + key;
    panel.innerHTML = '<div class="result-block"><div class="result-text streaming" id="text-' + key + '"></div></div>';
    panels.appendChild(panel);
  });
}

function switchTab(key) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === key));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + key));
}

// ── Parse & Format ─────────────────────────────────────
function renderFinalOutput(key, rawText) {
  const el = document.getElementById('text-' + key);
  if (!el) return;
  el.classList.remove('streaming');

  if (key === 'titles') {
    const lines = rawText.split('\n').filter(l => /^\d+[\.\、]/.test(l.trim()));
    if (lines.length) {
      const panel = el.closest('.result-block');
      panel.innerHTML = '<div class="title-list">' +
        lines.map((l, i) => {
          const text = l.replace(/^\d+[\.\、]\s*/, '');
          return `<div class="title-item">
            <span class="num">${String(i+1).padStart(2,'0')}</span>
            <span class="text">${escHtml(text)}</span>
            <button class="copy-btn" onclick="copyText(this,'${escHtml(text).replace(/'/g,'&#39;')}')">复制</button>
          </div>`;
        }).join('') + '</div>';
      return;
    }
  }

  if (key === 'report') {
    // Try to extract scores and render fancy report
    renderReport(el, rawText);
    return;
  }

  el.innerHTML = escHtml(rawText);
  // Add copy button
  const block = el.closest('.result-block');
  const btn = document.createElement('button');
  btn.className = 'copy-btn';
  btn.textContent = '复制';
  btn.onclick = () => copyText(btn, rawText);
  block.appendChild(btn);
}

function renderReport(el, text) {
  const block = el.closest('.result-block');
  // Extract scores
  const scoreMap = {};
  const scoreLabels = ['选题热度','平台适配度','目标用户匹配','内容差异化','变现潜力'];
  scoreLabels.forEach(label => {
    const m = text.match(new RegExp(label + '[：:]*\\s*(\\d+)'));
    if (m) scoreMap[label] = parseInt(m[1]);
  });

  let html = '';
  if (Object.keys(scoreMap).length >= 3) {
    html += '<div class="health-grid">';
    Object.entries(scoreMap).forEach(([label, score]) => {
      const cls = score >= 75 ? 'high' : score >= 55 ? 'mid' : 'low';
      html += `<div class="health-metric">
        <div class="score ${cls}">${score}</div>
        <div class="label">${label}</div>
      </div>`;
    });
    html += '</div>';
  }

  // Render advice sections with icons
  const adviceText = text
    .replace(/[-\*]\s*(优势|亮点)/g, '✅ ')
    .replace(/[-\*]\s*(风险|注意|警告)/g, '⚠️ ')
    .replace(/[-\*]\s*(建议|优化)/g, '💡 ');

  html += '<div class="result-text">' + escHtml(adviceText) + '</div>';
  block.innerHTML = html;

  const btn = document.createElement('button');
  btn.className = 'copy-btn';
  btn.style.cssText = 'position:absolute;top:12px;right:12px';
  btn.textContent = '复制';
  btn.onclick = () => copyText(btn, text);
  block.style.position = 'relative';
  block.appendChild(btn);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Copy ──────────────────────────────────────────────
function copyText(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.textContent;
    btn.textContent = '已复制 ✓';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1500);
  });
}

// ── Section splitter ───────────────────────────────────
function splitSections(fullText, outs) {
  const result = {};
  // Find each section by ## heading
  const sectionHeaders = {
    titles: /##\s*一[、，,.]?\s*(爆款标题)/,
    script: /##\s*二[、，,.]?\s*(视频脚本)/,
    copy:   /##\s*三[、，,.]?\s*(图文文案)/,
    report: /##\s*四[、，,.]?\s*(内容体检报告)/
  };

  const indices = [];
  outs.forEach(key => {
    const m = fullText.match(sectionHeaders[key]);
    if (m) indices.push({ key, idx: fullText.indexOf(m[0]), header: m[0] });
  });
  indices.sort((a, b) => a.idx - b.idx);

  indices.forEach((item, i) => {
    const start = item.idx + item.header.length;
    const end = i + 1 < indices.length ? indices[i+1].idx : fullText.length;
    result[item.key] = fullText.slice(start, end).trim();
  });

  // Fallback: if no headers found, put all text in first output
  if (Object.keys(result).length === 0 && outs.length > 0) {
    result[outs[0]] = fullText;
  }

  return result;
}

// ── Main Generate ──────────────────────────────────────
async function generate() {
  const apiKey = document.getElementById('apiKey').value.trim();
  if (!apiKey) { showError('请先填写 Anthropic API Key'); return; }
  const topic = document.getElementById('topic').value.trim();
  if (!topic) { showError('请填写选题 / 内容主题'); return; }

  hideError();
  const btn = document.getElementById('generateBtn');
  btn.disabled = true;
  btn.textContent = '⏳ 生成中…';

  const progress = document.getElementById('progressBar');
  progress.classList.add('visible');

  const outSection = document.getElementById('outputSection');
  outSection.classList.add('visible');
  initOutputUI();

  const outs = [...state.outputs];
  const { prompt } = buildPrompt();

  // Switch to first tab
  if (outs.length > 0) switchTab(outs[0]);

  let fullText = '';
  let currentKey = outs[0];

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-opus-4-8',
        max_tokens: 4096,
        stream: true,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTP ${resp.status}`);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') continue;
        try {
          const json = JSON.parse(data);
          const delta = json.delta?.text || '';
          if (!delta) continue;

          fullText += delta;

          // Live update: find which section we're likely in
          const sections = splitSections(fullText, outs);
          outs.forEach(key => {
            const el = document.getElementById('text-' + key);
            if (el && sections[key]) {
              el.textContent = sections[key];
            }
          });
        } catch (_) {}
      }
    }

    // Final render
    const sections = splitSections(fullText, outs);
    outs.forEach(key => renderFinalOutput(key, sections[key] || '（未生成此内容）'));

  } catch (e) {
    showError('生成失败：' + e.message);
    outSection.classList.remove('visible');
  } finally {
    btn.disabled = false;
    btn.textContent = '🚀 重新生成';
    progress.classList.remove('visible');
  }
}

function showError(msg) {
  const el = document.getElementById('errorBox');
  el.textContent = '⚠️ ' + msg;
  el.classList.add('visible');
}
function hideError() {
  document.getElementById('errorBox').classList.remove('visible');
}

// Enter key on topic
document.getElementById('topic').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.metaKey) generate();
});
</script>
